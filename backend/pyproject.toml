[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korczak-nexus-backend"
version = "0.1.0"
description = "Backend do Korczak Nexus"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pymongo>=4.15,<5.0",
  "httpx>=0.27,<1.0",
  "bcrypt>=4.2,<5.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: testes que exigem um MongoDB em execução",
]

[tool.setuptools.packages.find]
where = ["src"]
