<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KORCZAK NEXUS</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#010915;color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}button,input{font:inherit}button{border:0;background:none;color:inherit}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#020c19;border-bottom:1px solid #10385e}.brand{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px}.brand b{font-size:18px}.brand span{display:block;color:#0795ff;font-size:12px;letter-spacing:3px}.circle{width:40px;height:40px;border:1px solid #0878dc;border-radius:50%;background:#06182c}.content{height:calc(100% - 70px);overflow:auto;padding:12px 14px 90px}.hero,.card,.panel{border:1px solid #0758a8;border-radius:18px;background:#06172a}.hero{min-height:270px;padding:28px;position:relative;overflow:hidden;background:radial-gradient(circle at 76% 45%,#073b77,#071b32 38%,#041324 76%)}.hero h1{font-size:31px;line-height:1.08;margin:0 0 18px;position:relative;z-index:2}.hero h1 span{color:#0795ff}.hero p{color:#c0d4ee;max-width:430px;line-height:1.5;position:relative;z-index:2}.eyebrow{color:#1e9bff;letter-spacing:1px;font-size:13px}.art{position:absolute;right:0;top:0;width:50%;height:100%;display:grid;place-items:center}.orb{width:165px;height:165px;border:1px solid #238cff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 42px #006dff55}.orb:before,.orb:after{content:"";position:absolute;width:250px;height:70px;border:1px solid #1689ff66;border-radius:50%;transform:rotate(25deg)}.orb:after{transform:rotate(-28deg)}.orb svg{width:90px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.quick button{min-height:120px;border:1px solid #0756a4;border-radius:16px;background:linear-gradient(160deg,#0b2542,#07182b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.qi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:1px solid #138cff;background:#082f59;font-size:24px}.purple{border-color:#814fff;background:#24145d}.green{border-color:#13d9a1;background:#063c3a}.gold{border-color:#ffb02d;background:#4a3210}.storage{padding:18px 20px;display:flex;align-items:center;gap:16px}.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(#0996ff 42%,#173653 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:9px;background:#06172a;border-radius:50%}.ring b{z-index:1}.storage-main{flex:1}.storage-main strong{display:block}.storage-main small{color:#91add0}.bar{height:11px;background:#11365d;border-radius:20px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#0795ff}.recent{margin-top:12px;overflow:hidden}.head{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #10385e}.head h2{font-size:18px;margin:0}.link{color:#0c9bff}.file{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;border-bottom:1px solid #10304f;text-align:left}.fi{width:40px;height:40px;border-radius:10px;background:#1479e8;display:grid;place-items:center;flex:none}.fileinfo{flex:1;min-width:0}.fileinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileinfo small{color:#91add0}.chev{font-size:22px;color:#9bb8da}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.status{padding:18px;min-height:120px}.si{font-size:24px;color:#0795ff}.ok{color:#17e7a0;display:block;margin-top:7px}.status small{display:block;color:#91add0;line-height:1.4;margin-top:8px}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#030e1c;border-top:1px solid #0a4d89;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#91a8c8;font-size:12px;gap:4px}.nav.active{color:#0b9cff}.center{margin:-22px auto 0;width:62px;height:62px;border-radius:50%;background:#04182e!important;border:2px solid #087cff!important;box-shadow:0 0 24px #0078ff88;color:#13a0ff!important;font-size:28px!important}.panel{overflow:hidden}.editor{padding:14px}.field{margin:10px 0}.field label{display:block;color:#91add0;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:12px;background:#031122;border:1px solid #174a78;border-radius:9px;color:white}.tools{display:flex;gap:6px;margin:8px 0}.tools button{padding:8px;border:1px solid #194d79;border-radius:8px}.editable{min-height:330px;background:white;color:#111;border-radius:9px;padding:18px;outline:0}.primary,.secondary{padding:11px 15px;border-radius:9px}.primary{background:#087fff}.secondary{border:1px solid #18517f}.login{height:100%;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 20%,#073566,#020b18 55%)}.loginbox{width:min(420px,100%);padding:28px;border:1px solid #0b72cf;border-radius:22px;background:#06172a}.loginbox input{width:100%;padding:13px;background:#031122;border:1px solid #194d79;border-radius:9px;color:white;margin:7px 0 12px}.toast{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#08233f;border:1px solid #138cff;border-radius:10px;padding:11px 16px;z-index:99;display:none}@media(max-width:650px){.hero{min-height:250px;padding:22px 18px}.hero h1{font-size:28px}.art{right:-90px;width:65%;opacity:.7}.quick{gap:7px}.quick button{min-height:105px}.twocol{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toast"></div><script>
let S={user:null,files:[],storage:'Nenhum armazenamento selecionado',edit:null},CB={};const app=document.getElementById('app'),main=()=>document.getElementById('main');
const logo='<svg viewBox="0 0 100 100" class="logo"><path fill="#087dff" d="M10 15h20v27l28-27h28L55 46l31 39H59L38 58l-8 8v19H10z"/><path fill="#0753ba" d="M10 15h10v70H10z"/></svg>';const art='<div class="orb"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#138cff" stroke-width="2"/><path d="M25 63h50L63 49 75 37H59L50 49l-9-12H25l12 12z" fill="#078dff"/></svg></div>';
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}window.__nativeResult=(id,j)=>{let c=CB[id];delete CB[id];if(c)c(JSON.parse(j))};function call(a,p,c){let id='x'+Date.now()+Math.random();CB[id]=c||(()=>{});Android.call(a,JSON.stringify(p||{}),id)}
function shell(){app.innerHTML='<header class="top"><div class="brand">'+logo+'<div><b>KORCZAK</b><span>NEXUS</span></div></div><button class="circle" onclick="account()">KT</button></header><main class="content" id="main"></main><nav class="bottom"><button id="nh" class="nav active" onclick="home()">⌂<span>Início</span></button><button id="nf" class="nav" onclick="files()">□<span>Arquivos</span></button><button class="nav center" onclick="home()">N</button><button class="nav" onclick="toast('Nexa será conectado ao Workspace')">▦<span>Planilhas</span></button><button id="nm" class="nav" onclick="more()">•••<span>Mais</span></button></nav>'}
function nav(x){document.querySelectorAll('.nav').forEach(e=>e.classList.remove('active'));let e=document.getElementById('n'+x);if(e)e.classList.add('active')}
function home(){nav('h');main().innerHTML='<section class="hero"><div><p class="eyebrow">BEM-VINDO, KORCZAK TECH</p><h1>Seus arquivos,<br><span>sempre com você.</span></h1><p>Armazene, organize e compartilhe seus arquivos de forma simples, rápida e segura.</p></div><div class="art">'+art+'</div></section><section class="quick"><button onclick="newFile()"><span class="qi">▣</span><span>Novo Arquivo</span></button><button onclick="pick()"><span class="qi purple">☁</span><span>Upload</span></button><button onclick="toast('Compartilhamento disponível')"><span class="qi green">♣</span><span>Compartilhar</span></button><button onclick="newFolder()"><span class="qi gold">▤</span><span>Pastas</span></button></section><section class="card storage"><div class="ring"><b>'+Math.min(99,S.files.length*4)+'%</b></div><div class="storage-main"><strong>Armazenamento</strong><small>'+esc(S.storage)+'</small><div class="bar"><i style="width:'+Math.min(92,S.files.length*4)+'%"></i></div></div><span class="chev" onclick="files()">›</span></section><section class="card recent"><div class="head"><h2>◷ Arquivos recentes</h2><span class="link" onclick="files()">Ver todos</span></div>'+(S.files.length?S.files.slice(0,5).map(row).join(''):'<div class="file"><div class="fileinfo"><b>Nenhum arquivo ainda</b><small>Escolha um armazenamento para começar.</small></div></div>')+'</section><section class="twocol"><article class="card status"><div class="si">♢</div><b>Segurança</b><span class="ok">● Ativo</span><small>Seus arquivos ficam sob o controle do armazenamento escolhido.</small></article><article class="card status"><div class="si">☁</div><b>BYOS</b><span class="ok">● Ativado</span><small>O conteúdo permanece no armazenamento selecionado.</small></article></section>'}
function row(f){return '<button class="file" onclick="openFile('+JSON.stringify(f).replace(/"/g,'&quot;')+')"><div class="fi">□</div><div class="fileinfo"><b>'+esc(f.name)+'</b><small>'+esc(f.mime||'arquivo')+' • '+(f.size||0)+' bytes</small></div><span class="chev">›</span></button>'}
function files(){nav('f');call('listFiles',{},r=>{if(!r.ok)return toast(r.error);S.files=r.files||[];main().innerHTML='<section class="panel"><div class="head"><h2>Arquivos</h2><div><button class="primary" onclick="newFile()">Novo</button><button class="secondary" onclick="pick()">Armazenamento</button></div></div>'+(S.files.length?S.files.map(row).join(''):'<div class="file"><div class="fileinfo"><b>Nenhum arquivo</b><small>Escolha uma pasta no BYOS.</small></div></div>')+'</section>'})}
function pick(){call('pickStorage',{},r=>{if(r.ok){S.storage=r.label;files()}else toast(r.error||'Cancelado')})}function newFile(){if(S.storage==='Nenhum armazenamento selecionado')return pick();editor({name:'Novo documento.txt',content:''})}function newFolder(){call('createFolder',{name:'Nova pasta'},r=>{toast(r.ok?'Pasta criada':r.error);files()})}
function openFile(f){if((f.mime||'').startsWith('text/')||/\.(txt|md|html|json|csv|xml|js|css)$/i.test(f.name)){call('readFile',{uri:f.uri},r=>r.ok?editor({name:f.name,content:r.content,uri:f.uri}):toast(r.error))}else call('openFile',{uri:f.uri},r=>{if(!r.ok)toast(r.error)})}
function editor(o){S.edit=o;nav('m');main().innerHTML='<section class="panel"><div class="head"><h2>Editor</h2><div><button class="secondary" onclick="files()">Voltar</button><button class="primary" onclick="save()">Salvar</button></div></div><div class="editor"><div class="field"><label>Nome</label><input id="ename" value="'+esc(o.name)+'"></div><div class="tools"><button onclick="document.execCommand(\'bold\')"><b>B</b></button><button onclick="document.execCommand(\'italic\')"><i>I</i></button><button onclick="document.execCommand(\'underline\')"><u>U</u></button><button onclick="document.execCommand(\'insertUnorderedList\')">• Lista</button></div><div id="ed" class="editable" contenteditable="true">'+(o.content||'')+'</div></div></section>'}
function save(){let n=document.getElementById('ename').value.trim()||'Novo documento.txt',c=document.getElementById('ed').innerHTML;call('writeFile',{uri:S.edit.uri||'',name:n,content:c},r=>{if(r.ok){toast('Arquivo salvo no BYOS');files()}else toast(r.error)})}
function more(){nav('m');main().innerHTML='<section class="panel"><div class="head"><h2>Mais</h2></div><button class="file" onclick="account()"><div class="fi">KT</div><div class="fileinfo"><b>Minha conta</b><small>Perfil e sessão</small></div></button><button class="file" onclick="pick()"><div class="fi">☁</div><div class="fileinfo"><b>BYOS</b><small>Trocar armazenamento</small></div></button><button class="file" onclick="call(\'checkUpdate\',{},r=>toast(r.message))"><div class="fi">↻</div><div class="fileinfo"><b>Atualizações</b><small>Verificar versão</small></div></button></section>'}
function account(){nav('m');main().innerHTML='<section class="panel"><div class="head"><h2>Minha conta</h2></div><div class="file"><div class="fileinfo"><b>'+esc(S.user?.name||'Usuário')+'</b><small>'+esc(S.user?.email||'')+'</small></div></div><button class="file" onclick="call(\'logout\',{},()=>login())"><div class="fi">↪</div><div class="fileinfo"><b>Sair</b><small>Encerrar sessão</small></div></button></section>'}
function login(){app.innerHTML='<main class="login"><section class="loginbox">'+logo+'<p class="eyebrow">KORCZAK TECHNOLOGIES</p><h1>KORCZAK NEXUS</h1><p>Seus arquivos, sempre com você.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="pass" type="password"><button class="primary" style="width:100%" onclick="doLogin()">Entrar</button></section></main>'}
function doLogin(){call('api',{method:'POST',path:'/api/v1/auth/login',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('pass').value})},r=>{if(!r.ok)return toast(r.error);S.user=r.data.user;home()})}
function boot(){shell();call('session',{},r=>{if(!r.ok)return login();S.user=r.user;call('storageInfo',{},x=>{if(x.ok){S.storage=x.label;S.files=x.files||[]}home()})})}boot();
</script></body></html>
