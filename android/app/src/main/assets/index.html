<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KORCZAK NEXUS</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020a16;color:#edf5ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}.app{max-width:900px;min-height:100vh;margin:auto;background:radial-gradient(circle at 50% 18%,#082044 0,#03101f 38%,#020811 75%);border-left:1px solid #0875ff88;border-right:1px solid #0875ff88}.top{height:112px;border-bottom:1px solid #12457a;display:flex;align-items:center;justify-content:space-between;padding:30px 34px 18px}.brand{display:flex;align-items:center;gap:14px}.klogo{width:58px;height:58px}.brand b{display:block;font-size:24px;letter-spacing:2px}.brand span{display:block;color:#1688ff;letter-spacing:4px;font-size:16px;margin-top:2px}.actions{display:flex;align-items:center;gap:22px}.bell{font-size:30px;color:#dcecff}.avatar{width:46px;height:46px;border:1px solid #1688ff;border-radius:50%;display:grid;place-items:center;color:#bfe1ff}.content{padding:14px 22px 100px}.hero{min-height:270px;border:1px solid #1261ad;border-radius:20px;overflow:hidden;position:relative;padding:38px 32px;background:linear-gradient(115deg,#06152a,#031122 60%,#061b36)}.hero h1{font-size:38px;line-height:1.05;margin:8px 0 24px;max-width:450px}.blue{color:#148dff}.hero p{max-width:430px;color:#c3d5eb;font-size:17px;line-height:1.45}.hero-art{position:absolute;right:4%;top:22px;width:42%;height:90%;display:grid;place-items:center}.orb{width:150px;height:150px;border:1px solid #1688ff;border-radius:50%;box-shadow:0 0 30px #0875ff77,inset 0 0 30px #0875ff55;display:grid;place-items:center;font-size:74px;color:#1688ff}.orbit{position:absolute;width:250px;height:95px;border:1px solid #1688ff88;border-radius:50%;transform:rotate(-22deg)}.orbit.o2{transform:rotate(35deg);width:220px}.eyebrow{color:#45a5ff;letter-spacing:1px;font-size:14px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}.quick button{min-height:150px;background:#07172a;border:1px solid #12539a;border-radius:18px;color:#edf5ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px}.qi{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid #258cff;background:#0a3970;font-size:28px}.storage{border:1px solid #12539a;border-radius:18px;background:#06162a;padding:20px 24px;display:flex;align-items:center;gap:18px}.ring{width:95px;height:95px;border-radius:50%;background:conic-gradient(#1692ff 42%,#173758 0);display:grid;place-items:center}.ring:after{content:'42%';width:73px;height:73px;border-radius:50%;background:#06162a;display:grid;place-items:center;font-size:18px}.storage main{flex:1}.storage h3{margin:0 0 8px;font-size:18px}.bar{height:13px;border-radius:20px;background:#163657;overflow:hidden}.bar i{display:block;height:100%;width:42%;background:#1595ff;border-radius:20px}.recent{margin-top:18px;border:1px solid #12539a;border-radius:18px;background:#06162a;overflow:hidden}.sectionhead{display:flex;justify-content:space-between;padding:22px;border-bottom:1px solid #16385f;font-size:18px}.sectionhead button,.link{background:none;border:0;color:#1595ff}.file{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid #143252}.file:last-child{border:0}.fileicon{width:48px;height:48px;border-radius:12px;background:#0b62c5;display:grid;place-items:center;font-size:22px}.filetext{flex:1}.filetext small{display:block;color:#91a9c5;margin-top:4px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(900px,100%);height:84px;background:#061327f2;border:1px solid #145aa0;display:flex;justify-content:space-around;align-items:center;z-index:5}.bottom button{border:0;background:none;color:#9bb1ce;font-size:13px}.bottom button.active{color:#1695ff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet{width:min(900px,100%);background:#071729;border:1px solid #1664a9;border-radius:24px 24px 0 0;padding:24px;max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.input,.editor{width:100%;background:#03101e;border:1px solid #21486e;color:white;border-radius:10px;padding:13px;margin:7px 0 14px}.editor{min-height:380px;resize:vertical;font:15px/1.6 monospace}.primary{background:#0b79e8;border:0;border-radius:10px;color:white;padding:13px 20px;font-weight:700}.secondary{background:#10243b;border:1px solid #275274;color:#cde0f5;border-radius:10px;padding:13px 20px}.sheet-actions{display:flex;gap:10px;justify-content:flex-end}.empty{padding:40px;text-align:center;color:#8fa6c1}@media(max-width:650px){.top{height:94px;padding:24px 16px 12px}.brand b{font-size:18px}.brand span{font-size:12px}.klogo{width:48px}.content{padding:10px 12px 95px}.hero{min-height:380px;padding:25px 22px}.hero h1{font-size:31px}.hero-art{width:100%;height:46%;top:auto;bottom:-30px;right:0;opacity:.85}.quick{grid-template-columns:repeat(2,1fr);gap:10px}.quick button{min-height:125px}.storage{padding:16px}.ring{width:76px;height:76px}.ring:after{width:58px;height:58px}.file{padding:14px}.actions{gap:12px}.bell{font-size:24px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><svg class="klogo" viewBox="0 0 100 100"><path fill="#087cff" d="M10 10h25v31l30-31h29L58 47l38 43H66L35 57v33H10z"/><path fill="#0757b8" d="M10 10h12v80H10z"/></svg><div><b>KORCZAK</b><span>NEXUS</span></div></div><div class="actions"><span class="bell">♧</span><span class="avatar" id="avatar">KT</span></div></header><main class="content"><section class="hero"><div class="eyebrow">BEM-VINDO, KORCZAK TECH</div><h1>Seus arquivos,<br><span class="blue">sempre com você.</span></h1><p>Armazene, organize e compartilhe seus arquivos de forma simples, rápida e segura.</p><div class="hero-art"><div class="orbit"></div><div class="orbit o2"></div><div class="orb">N</div></div></section><section class="quick"><button onclick="newFile()"><span class="qi">▣</span>Novo Arquivo</button><button onclick="pickFile()"><span class="qi">↑</span>Upload</button><button onclick="share()"><span class="qi">♧</span>Compartilhar</button><button onclick="newFolder()"><span class="qi">▤</span>Pastas</button></section><section class="storage"><div class="ring"></div><main><h3>Armazenamento</h3><div id="storageLabel">BYOS — nenhum armazenamento selecionado</div><br><div class="bar"><i></i></div></main><button class="secondary" onclick="chooseStorage()">›</button></section><section class="recent"><div class="sectionhead"><b>◷ &nbsp;Arquivos recentes</b><button onclick="refresh()">Ver todos</button></div><div id="files"><div class="empty">Carregando arquivos…</div></div></section></main><nav class="bottom"><button class="active">⌂<br>Início</button><button onclick="refresh()">□<br>Arquivos</button><button onclick="newFile()" style="font-size:28px;color:#1595ff">N</button><button onclick="showEditor()">▦<br>Editor</button><button onclick="chooseStorage()">•••<br>Mais</button></nav></div><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Novo documento</h2><label>Nome<input class="input" id="name" value="Novo documento.txt"></label><label>Conteúdo<textarea class="editor" id="body"></textarea></label><div class="sheet-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveFile()">Salvar no BYOS</button></div></div></div><script>
let bridgeId=0,pending={};function native(action,payload={}){return new Promise(resolve=>{let id='c'+(++bridgeId);pending[id]=resolve;if(window.Android){Android.call(action,JSON.stringify(payload),id)}else resolve({ok:false,error:'Android nativo indisponível'})})}window.__nativeResult=(id,json)=>{let r=pending[id];if(r){delete pending[id];r(JSON.parse(json))}};
async function chooseStorage(){let r=await native('pickStorage');if(r.ok){document.getElementById('storageLabel').textContent=r.label||'Armazenamento selecionado';refresh()}else if(r.error)alert(r.error)}
async function refresh(){let r=await native('listFiles');if(!r.ok)return;document.getElementById('storageLabel').textContent=r.label||'Nenhum armazenamento selecionado';let fs=r.files||[];document.getElementById('files').innerHTML=fs.length?fs.slice(0,8).map(f=>'<div class="file" onclick="openFile('+JSON.stringify(f.uri)+')"><span class="fileicon">▧</span><div class="filetext"><b>'+esc(f.name)+'</b><small>'+size(f.size)+'</small></div><span>›</span></div>').join(''):'<div class="empty">Nenhum arquivo no armazenamento selecionado.</div>'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function size(n){if(!n)return'';let u=['B','KB','MB','GB'],i=0;while(n>1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function openFile(uri){native('openFile',{uri})}function closeModal(){document.getElementById('modal').style.display='none'}function newFile(){document.getElementById('modalTitle').textContent='Novo documento';document.getElementById('name').value='Novo documento.txt';document.getElementById('body').value='';document.getElementById('modal').style.display='flex'}
async function saveFile(){let name=document.getElementById('name').value||'Novo documento.txt',content=document.getElementById('body').value,r=await native('writeFile',{name,content});if(!r.ok){alert(r.error||'Não foi possível salvar');return}closeModal();refresh()}
async function newFolder(){let name=prompt('Nome da pasta:','Nova pasta');if(name){let r=await native('createFolder',{name});if(!r.ok)alert(r.error||'Não foi possível criar');refresh()}}
async function pickFile(){let r=await native('pickFile');if(!r.ok&&r.error)alert(r.error);else refresh()}
async function share(){if(navigator.share){navigator.share({title:'KORCZAK NEXUS',text:'Compartilhamento de arquivo'})}else alert('Selecione um arquivo para compartilhar.')}
function showEditor(){newFile();document.getElementById('modalTitle').textContent='Editor KORCZAK NEXUS'}
refresh();
</script></body></html>
