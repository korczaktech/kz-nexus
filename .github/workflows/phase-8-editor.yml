name: Fase 8 - Editor de Documentos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-editor:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Validar modelos e testes unitários
        working-directory: backend
        run: pytest -m "not integration"
      - name: Validar editor e concorrência com MongoDB
        working-directory: backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: KZDocs
        run: pytest tests/test_api_integration.py -m integration

  frontend-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar frontend
        working-directory: frontend
        run: npm install
      - name: Build TypeScript e Vite
        working-directory: frontend
        run: npm run build
      - name: Testes do editor
        working-directory: frontend
        run: npm test -- --run

      - name: Validar JavaScript embarcado no Android
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Validando $file"
            node --check "$file"
          done < <(find android/app/src/main/assets -type f -name '*.js' -print0)

