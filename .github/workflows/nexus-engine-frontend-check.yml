name: Nexus Engine Frontend Integration

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/components/Editor.tsx"
      - "frontend/src/services/nexusEngineAdapter.ts"
      - "packages/engine/src/**"
      - ".github/workflows/nexus-engine-frontend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
      - name: Install engine dependencies
        working-directory: packages/engine
        run: npm install --no-audit --no-fund
      - name: Typecheck, test and build engine
        working-directory: packages/engine
        run: npm run typecheck && npm test && npm run build
      - name: Typecheck and build engine preview
        run: packages/engine/node_modules/.bin/tsc -p packages/engine-preview/tsconfig.json --noEmit && node packages/engine-preview/build.mjs
