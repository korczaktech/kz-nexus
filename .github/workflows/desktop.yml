name: Desktop CI\non:\n  push:\n    branches: [main]\n    paths: ["desktop/**",".github/workflows/desktop.yml"]\n  pull_request:\n    paths: ["desktop/**",".github/workflows/desktop.yml"]\n  workflow_dispatch:\npermissions: {contents: read}\njobs:\n  test:\n    runs-on: ubuntu-latest\n    defaults: {run: {working-directory: desktop}}\n    steps:\n      - uses: actions/checkout@v5\n      - uses: actions/setup-node@v5\n        with: {node-version: "22"}\n      - run: npm install\n      - run: npm test\n      - run: npm run build\n  package:\n    needs: test\n    strategy:\n      fail-fast: false\n      matrix:\n        include:\n          - {os: windows-latest, command: "npm run dist:win", artifact: windows, path: "desktop/dist/*.exe"}\n          - {os: macos-15, command: "npm run dist:mac", artifact: macos, path: "desktop/dist/*.dmg"}\n          - {os: ubuntu-24.04, command: "npm run dist:linux", artifact: linux, path: "desktop/dist/*"}\n    runs-on: ${{ matrix.os }}\n    defaults: {run: {working-directory: desktop}}\n    steps:\n      - uses: actions/checkout@v5\n      - uses: actions/setup-node@v5\n        with: {node-version: "22"}\n      - run: npm install\n      - run: ${{ matrix.command }}\n      - uses: actions/upload-artifact@v4\n        with: {name: "Korczak-Nexus-Desktop-${{ matrix.artifact }}",path: "${{ matrix.path }}",if-no-files-found: error}\n