name: Desktop CI
on:
  push:
    branches: [main]
    paths: ["desktop/**",".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**",".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - run: npm install
      - run: npm test
      - run: npm run build
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, command: "npm run dist:win", artifact: windows, path: "desktop/dist/*.exe"}
          - {os: macos-15, command: "npm run dist:mac", artifact: macos, path: "desktop/dist/*.dmg"}
          - {os: ubuntu-24.04, command: "npm run dist:linux", artifact: linux, path: "desktop/dist/*"}
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - run: npm install
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with: {name: "Korczak-Nexus-Desktop-${{ matrix.artifact }}",path: "${{ matrix.path }}",if-no-files-found: error}
