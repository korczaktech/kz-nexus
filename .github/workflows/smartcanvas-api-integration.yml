name: SmartCanvas API integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-integration:
    name: Real API save, autosave, versions and conflict checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      API_HOST: 127.0.0.1
      API_PORT: 8000
      FRONTEND_URL: http://localhost:5173
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: KZDocsSmartCanvasCI
      MONGODB_ACCOUNTS_DATABASE: ContasSmartCanvasCI
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: 10000
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -e ".[test]"
      - name: Run real MongoDB-backed API integration
        working-directory: backend
        run: python -m pytest tests/test_api_integration.py -m integration
      - name: Install frontend and Playwright browser dependencies
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Build frontend against the local API
        working-directory: frontend
        run: VITE_API_BASE_URL=http://127.0.0.1:8000 npm run build
      - name: Start the real API server
        run: |
          nohup python -m uvicorn korczak_documents.main:app --host 127.0.0.1 --port 8000 > /tmp/smartcanvas-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/smartcanvas-api.log
          exit 1
      - name: Start frontend preview
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 5173 > /tmp/smartcanvas-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/smartcanvas-frontend.log
          exit 1
      - name: Run SmartCanvas browser E2E against real API in Chromium, Firefox and WebKit
        timeout-minutes: 8
        run: |
          for browser in chromium firefox webkit; do
            echo "Running SmartCanvas API E2E in $browser"
            SMARTCANVAS_E2E_BROWSER="$browser" timeout 120s node scripts/smartcanvas-api-e2e.mjs
          done
        env:
          SMARTCANVAS_E2E_BASE_URL: http://localhost:5173
          SMARTCANVAS_E2E_API_URL: http://127.0.0.1:8000
