name: Production API Health Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api-health
  cancel-in-progress: true

jobs:
  health:
    name: Check production API liveness and readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check liveness and readiness
        env:
          API_BASE_URL: ${{ vars.NEXUS_API_BASE_URL || 'https://kzdoc.onrender.com' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$API_BASE_URL" =~ ^https://[^/]+/?$ ]] || { echo "Configure NEXUS_API_BASE_URL as an HTTPS origin."; exit 1; }
          API_BASE_URL="${API_BASE_URL%/}"
          fetch_json_with_retry() {
            local endpoint="$1"
            local expected_status="$2"
            local attempt response
            for attempt in 1 2 3 4 5; do
              if response="$(curl --fail --silent --show-error --max-time 20 "$API_BASE_URL/$endpoint" 2>&1)" &&
                 printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); expected=sys.argv[1]; assert d.get("status") == expected, d' "$expected_status"; then
                echo "$endpoint check passed (attempt $attempt)." >&2
                printf '%s' "$response"
                return 0
              fi
              echo "$endpoint check attempt $attempt/5 failed; retrying after 8 seconds." >&2
              if [[ "$attempt" -lt 5 ]]; then sleep 8; fi
            done
            echo "$endpoint did not report status '$expected_status' after 5 attempts." >&2
            return 1
          }
          fetch_json_with_retry health ok >/dev/null
          fetch_json_with_retry ready ready >/dev/null
          echo "Liveness and database readiness checks passed."
