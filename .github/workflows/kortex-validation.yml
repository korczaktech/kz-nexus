name: Kortex validation

on:
  push:
    branches:
      - main
      - fix/kortex-layout-completion
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/engine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  engine-preview:
    name: SmartCanvas preview tests, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install engine dependencies
        working-directory: packages/engine
        run: npm ci
      - name: Build engine package
        working-directory: packages/engine
        run: npm run build
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
