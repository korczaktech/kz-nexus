name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: true

jobs:
  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kzdoc-release.jks"

      - name: Calculate Android version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_max="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | sub("^v"; "") | select(test("^[0-9]+(\\.[0-9]+){0,3}$")) | split(".")[-1] | tonumber] | max // 0')"
          tag_max="$(git ls-remote --tags origin 'v0.0.0.*' | sed -E 's#.*refs/tags/v0\.0\.0\.([0-9]+)$#\1#' | sort -n | tail -1 || true)"
          tag_max="${tag_max:-0}"
          next_code=$((release_max + 1))
          if [ "$next_code" -le "$tag_max" ]; then next_code=$((tag_max + 1)); fi
          if [ "$next_code" -le 159 ]; then next_code=160; fi
          VERSION="0.0.0.$next_code"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$next_code" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/kzdoc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon --parallel -PreleaseVersion="$VERSION" -PreleaseCode="$VERSION_CODE"

      - name: Publish APK and updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="Korczak-HUB-Nexus-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"

          gh release create "v$VERSION" "$APK"             --repo "$GITHUB_REPOSITORY"             --title "Korczak HUB Nexus $VERSION"             --generate-notes

          sha256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '{
  "version": "%s",
  "url": "https://github.com/%s/releases/download/v%s/%s",
  "sha256": "%s"
}
'             "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" "$APK" "$sha256" > "$RUNNER_TEMP/update.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin updates
          git switch -C updates origin/updates
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/update.json" update.json
          git add update.json
          git diff --cached --quiet || git commit -m "chore(updater): publicar manifesto da versão $VERSION"
          git push origin updates
