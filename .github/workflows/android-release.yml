name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kzdoc-release.jks"

      - name: Calculate version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v0\.0\.0\.[0-9]+$' | sed 's/^v0\.0\.0\.//' | sort -n | tail -1 || true)"
          latest="${latest:-159}"
          code=$((latest + 1))
          echo "VERSION=0.0.0.$code" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/kzdoc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --parallel -PreleaseVersion="$VERSION" -PreleaseCode="$VERSION_CODE"

      - name: Publish release and updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="Korczak-HUB-Nexus-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v$VERSION" "$APK" --repo "$GITHUB_REPOSITORY" --title "Korczak HUB Nexus $VERSION" --generate-notes

          sha256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s\n' '{' '  "version": "'"$VERSION"'",' '  "url": "https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/v'"$VERSION"'/'"$APK"'",' '  "sha256": "'"$sha256"'"' '}' > update.json

          content="$(base64 -w 0 update.json)"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/update.json?ref=updates" --jq '.sha')"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/update.json"             -f message="chore(updater): publicar $VERSION"             -f content="$content"             -f branch="updates"             -f sha="$existing"
