name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        api-level: [35]
        profile: [pixel_2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: JVM tests
        run: gradle -p android test
      - name: Android debug build verification
        run: gradle -p android assembleDebug
      - name: Launch Activity on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: gradle -p android connectedDebugAndroidTest

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::Configure ANDROID_KEYSTORE_BASE64."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Configure ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Configure ANDROID_KEY_ALIAS."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Configure ANDROID_KEY_PASSWORD."; exit 1; }

      - name: Calculate monotonic Android version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_count="$(git rev-list --count HEAD)"
          release_max="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | sub("^v"; "") | select(test("^[0-9]+(\\.[0-9]+){0,3}$")) | split(".")[-1] | tonumber] | max // 0')"
          tag_max="$(git tag --list 'v0.0.0.*' | sed 's/^v0.0.0.//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          tag_max="${tag_max:-0}"
          next_code=$((commit_count + 1))
          if [ "$next_code" -le "$release_max" ]; then next_code=$((release_max + 1)); fi
          if [ "$next_code" -le "$tag_max" ]; then next_code=$((tag_max + 1)); fi
          if [ "$next_code" -le 159 ]; then next_code=160; fi
          VERSION="0.0.0.${next_code}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$next_code" >> "$GITHUB_ENV"
          echo "Release: $VERSION"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kzdoc-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/kzdoc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease -PreleaseVersion="$VERSION" -PreleaseCode="$VERSION_CODE"

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Korczak-HUB-Nexus-$VERSION.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "Korczak-HUB-Nexus-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Korczak HUB Nexus $VERSION" \
            --generate-notes

      - name: Publish updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256="$(sha256sum "Korczak-HUB-Nexus-$VERSION.apk" | awk '{print $1}')"
          cat > "$RUNNER_TEMP/update.json" <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Korczak-HUB-Nexus-$VERSION.apk",
            "sha256": "$sha256"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin updates >/dev/null 2>&1; then
            git fetch origin updates
            git switch -C updates origin/updates
            git rm -rf . || true
          else
            git switch --orphan updates
            git rm -rf . || true
          fi
          cp "$RUNNER_TEMP/update.json" update.json
          git add update.json
          git diff --cached --quiet || git commit -m "chore(updater): publicar manifesto da versão $VERSION"
          git push origin updates
