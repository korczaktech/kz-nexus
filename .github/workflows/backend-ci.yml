name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/security-secret-scan.sh"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/security-secret-scan.sh"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests (Python 3.12 + MongoDB 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      MONGODB_DATABASE: KZDocs
      MONGODB_ACCOUNTS_DATABASE: Contas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install MongoDB Database Tools
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
          mongodump --version
          mongorestore --version

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Run backend test suite
        run: pytest -q

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and Git history
        run: bash scripts/security-secret-scan.sh
