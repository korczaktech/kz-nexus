name: SmartCanvas Memory Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smartcanvas-memory-baseline.yml"
      - "packages/engine/**"
      - "packages/engine-preview/**"
      - "frontend/**"
      - "docs/nexus-engine/SMARTCANVAS-PLAN.md"
      - "docs/nexus-engine/PERFORMANCE.md"

permissions:
  contents: read

jobs:
  memory-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --global playwright
          playwright install --with-deps chromium
      - name: Build engine
        working-directory: packages/engine
        run: |
          npm ci
          npm run build
      - name: Build standalone preview
        working-directory: packages/engine-preview
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build production React frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          VITE_API_BASE_URL=https://kzdoc.onrender.com npm run build
      - name: Collect three memory baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p memory-baseline
          for run in 1 2 3; do
            echo "Collecting standalone engine preview baseline $run/3"
            node packages/engine/tooling/memory-baseline.mjs > "memory-baseline/engine-run-$run.json"
            echo "Collecting production React editor baseline $run/3"
            node packages/engine/tooling/production-editor-memory.mjs > "memory-baseline/frontend-run-$run.json"
          done
      - name: Upload memory reports
        uses: actions/upload-artifact@v4
        with:
          name: smartcanvas-memory-baseline
          path: memory-baseline/*.json
          if-no-files-found: error
          retention-days: 30
