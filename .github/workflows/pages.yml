name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install engine dependencies
        working-directory: packages/engine
        run: npm install --no-audit --no-fund

      - name: Verify engine
        working-directory: packages/engine
        run: npm run typecheck && npm test && npm run build

      - name: Install engine preview dependencies
        working-directory: packages/engine-preview
        run: npm install --no-audit --no-fund

      - name: Test and build engine preview
        working-directory: packages/engine-preview
        run: npm run typecheck && npm test && npm run build

      - name: Validate Phase 1 parity
        run: node scripts/check-phase1-parity.mjs

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build Vite application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://kzdoc.onrender.com
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI || secrets.GOOGLE_REDIRECT_URI }}
        run: npm run build

      - name: Publish engine preview alongside the frontend
        run: |
          cp packages/engine-preview/dist/preview-standalone.html frontend/dist/engine-preview.html
          test -f frontend/dist/engine-preview.html

      - name: Generate Android-compatible PWA PNG icons
        working-directory: frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p dist/icons
          rsvg-convert -w 192 -h 192 public/icons/nexus-icon-192.svg -o dist/icons/nexus-icon-192.png
          rsvg-convert -w 512 -h 512 public/icons/nexus-icon-512.svg -o dist/icons/nexus-icon-512.png

      - name: Verify build
        working-directory: frontend
        run: |
          test -f dist/index.html
          test -f dist/icons/nexus-icon-192.png
          test -f dist/icons/nexus-icon-512.png
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/sobre/index.html
          test -f dist/recursos/index.html
          grep -q 'Korczak Nexus' dist/index.html
          grep -q 'nexus.korczaktech.com.br/sitemap.xml' dist/robots.txt
          grep -q '<urlset' dist/sitemap.xml
          # GitHub Pages needs a 404 fallback for React routes like /privacy and /terms.
          cp dist/index.html dist/404.html
          test -f dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
