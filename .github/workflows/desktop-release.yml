name: Desktop Release\non:\n  workflow_dispatch:\n    inputs:\n      version:\n        description: "Versão Desktop"\n        required: true\n        default: "0.0.0.293"\n  push:\n    tags: ["desktop-v*.*.*"]\npermissions: {contents: write}\njobs:\n  build:\n    strategy:\n      fail-fast: false\n      matrix:\n        include:\n          - {os: windows-latest, command: "npm run dist:win", glob: "desktop/dist/*.exe"}\n          - {os: macos-15, command: "npm run dist:mac", glob: "desktop/dist/*.dmg"}\n          - {os: ubuntu-24.04, command: "npm run dist:linux", glob: "desktop/dist/*"}\n    runs-on: ${{ matrix.os }}\n    steps:\n      - uses: actions/checkout@v5\n      - uses: actions/setup-node@v5\n        with: {node-version: "22"}\n      - name: Set version\n        if: github.event_name == "workflow_dispatch"\n        working-directory: desktop\n        run: npm version "${{ inputs.version }}" --no-git-tag-version\n      - working-directory: desktop\n        run: npm install\n      - working-directory: desktop\n        run: ${{ matrix.command }}\n      - uses: actions/upload-artifact@v4\n        with: {name: "desktop-${{ matrix.os }}",path: "${{ matrix.glob }}",if-no-files-found: error}\n  release:\n    needs: build\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/download-artifact@v4\n        with: {pattern: "desktop-*",path: release-assets,merge-multiple: true}\n      - name: Publish\n        env: {GH_TOKEN: ${{ github.token }}}\n        run: |\n          set -euo pipefail\n          if [ "${{ github.event_name }}" = "push" ]; then TAG="${GITHUB_REF_NAME}"; VERSION="${TAG#desktop-v}"; else VERSION="${{ inputs.version }}"; TAG="desktop-v$VERSION"; fi\n          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Korczak Nexus Desktop $VERSION" --generate-notes\n