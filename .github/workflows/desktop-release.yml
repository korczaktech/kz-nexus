name: Desktop Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão Desktop"
        required: true
        default: "0.0.293"
  push:
    tags: ["desktop-v*.*.*"]
permissions: {contents: write}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, command: "npm run dist:win", glob: "desktop/dist/*.exe"}
          - {os: macos-15, command: "npm run dist:mac", glob: "desktop/dist/*.dmg"}
          - {os: ubuntu-24.04, command: "npm run dist:linux", glob: "desktop/dist/*"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - name: Set version
        if: github.event_name == "workflow_dispatch"
        working-directory: desktop
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - working-directory: desktop
        run: npm install
      - working-directory: desktop
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with: {name: "desktop-${{ matrix.os }}",path: "${{ matrix.glob }}",if-no-files-found: error}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "desktop-*"
          path: release-assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#desktop-v}"
          else
            VERSION="${{ inputs.version }}"
            TAG="desktop-v$VERSION"
          fi
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Korczak Nexus Desktop $VERSION" --generate-notes
