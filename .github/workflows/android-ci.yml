name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Run Android unit tests
        run: gradle -p android testDebugUnit --no-daemon --stacktrace

      - name: Build Android debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/debug/app-debug.apk
