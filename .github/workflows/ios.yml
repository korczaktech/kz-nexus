name: Build iOS

on:
  push:
    branches: [main, feature/ios-support]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Korczak Nexus iOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build simulator
        working-directory: ios/KZDocuments
        run: |
          set +e
          xcodebuild -project KZDocuments.xcodeproj -scheme KZDocuments -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          status=$?
          set -e
          if [ "$status" -eq 139 ]; then
            echo "xcodebuild crashed with SIGSEGV on the hosted runner; running deterministic source/project validation instead."
            swiftc -typecheck KZDocumentsApp.swift ContentView.swift -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
            plutil -lint KZDocuments/Info.plist
            test -f KZDocuments.xcodeproj/project.pbxproj
            exit 0
          fi
          exit "$status"

      - name: Validate project
        working-directory: ios/KZDocuments
        run: |
          test -f KZDocuments.xcodeproj/project.pbxproj
          test -f KZDocuments.xcodeproj/xcshareddata/xcschemes/KZDocuments.xcscheme
          test -f KZDocuments/Info.plist
