name: KZ Nexus Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Versão inválida: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Gradle project
        id: gradle
        shell: bash
        run: |
          set -e
          WRAPPER=$(find . -type f -name gradlew -print -quit)
          test -n "$WRAPPER" || { echo 'Android Gradle wrapper não encontrado.'; exit 1; }
          chmod +x "$WRAPPER"
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          cd "$(dirname '${{ steps.gradle.outputs.wrapper }}')"
          ./gradlew --no-daemon assembleRelease
      - name: Prepare APK
        run: |
          set -e
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" "release-assets/KZ-Nexus-Android-v${{ needs.prepare.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Nexus-Android
          path: release-assets/*.apk

  release:
    needs: [prepare, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KZ-Nexus-Android
          path: release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: KZ Nexus v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            ## KZ Nexus v${{ needs.prepare.outputs.version }}

            ### Downloads
            - **Android:** APK pronto para instalação.
            - **iPhone/iPad:** use o KZ Nexus diretamente no Safari e adicione à Tela de Início como app.

            ### PWA
            O KZ Nexus para iOS é distribuído como Web App/PWA. Não exige App Store, Apple Developer Program, IPA, Mac ou instalação de arquivo.
          files: release-assets/*
