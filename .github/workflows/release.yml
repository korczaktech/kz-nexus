name: KZ Nexus Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: \${{ steps.version.outputs.version }}
      tag: \${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -e
          if [ "\$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="\${GITHUB_REF_NAME#v}"
          else
            VERSION="\${{ inputs.version }}"
          fi
          [[ "\$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Versão inválida: \$VERSION"; exit 1; }
          echo "version=\$VERSION" >> "\$GITHUB_OUTPUT"
          echo "tag=v\$VERSION" >> "\$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Gradle project
        id: gradle
        shell: bash
        run: |
          set -e
          WRAPPER=$(find . -type f -name gradlew -print -quit)
          test -n "\$WRAPPER" || { echo 'Android Gradle wrapper não encontrado.'; exit 1; }
          chmod +x "\$WRAPPER"
          echo "wrapper=\$WRAPPER" >> "\$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          cd "$(dirname '\${{ steps.gradle.outputs.wrapper }}')"
          ./gradlew --no-daemon assembleRelease
      - name: Prepare APK
        run: |
          set -e
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)
          test -n "\$APK"
          mkdir -p release-assets
          cp "\$APK" "release-assets/KZ-Nexus-Android-v\${{ needs.prepare.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Nexus-Android
          path: release-assets/*.apk

  ios:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS Simulator app
        working-directory: ios/KZDocuments
        run: |
          set -e
          xcodebuild \
            -project KZDocuments.xcodeproj \
            -scheme KZDocuments \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "\$RUNNER_TEMP/KZDocumentsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package iOS Simulator artifact
        run: |
          set -e
          APP=$(find "\$RUNNER_TEMP/KZDocumentsDerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "\$APP"
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "\$APP" "release-assets/KZ-Nexus-iOS-Simulator-v\${{ needs.prepare.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Nexus-iOS-Simulator
          path: release-assets/*.zip

  release:
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KZ-Nexus-Android
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: KZ-Nexus-iOS-Simulator
          path: release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ needs.prepare.outputs.tag }}
          name: KZ Nexus v\${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            ## KZ Nexus v\${{ needs.prepare.outputs.version }}

            ### Downloads
            - **Android:** APK pronto para instalação.
            - **iOS:** build gratuita para **iOS Simulator**. Não é uma IPA assinada para instalação direta em iPhone.

            ### Apple
            Esta pipeline não usa Apple Developer Program, certificados de distribuição, provisioning profiles, App Store Connect ou TestFlight.
          files: release-assets/*
