name: KZ Nexus Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Gradle project
        id: gradle
        shell: bash
        run: |
          set -e
          WRAPPER=$(find . -type f -name gradlew -print -quit)
          test -n "$WRAPPER" || { echo 'Android Gradle wrapper não encontrado.'; exit 1; }
          chmod +x "$WRAPPER"
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          cd "$(dirname '${{ steps.gradle.outputs.wrapper }}')"
          ./gradlew --no-daemon assembleRelease
      - name: Prepare APK
        run: |
          set -e
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" "release-assets/KZ-Nexus-Android-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Nexus-Android
          path: release-assets/*.apk

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Apple certificate
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          test -n "$CERT" && test -n "$CERT_PASSWORD"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          test -n "$PROFILE"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/KZDocuments.mobileprovision"
      - name: Archive and export IPA
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        working-directory: ios/KZDocuments
        run: |
          set -e
          xcodebuild archive -project KZDocuments.xcodeproj -scheme KZDocuments -configuration Release -archivePath "$RUNNER_TEMP/KZDocuments.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution'
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
<key>method</key><string>app-store</string>
<key>teamID</key><string>$TEAM</string>
<key>signingStyle</key><string>manual</string>
<key>provisioningProfiles</key><dict>
<key>com.korczaktech.kzdoc</key><string>KZ Documents Distribution</string>
</dict></dict></plist>
PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/KZDocuments.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp "$RUNNER_TEMP/export/"*.ipa "$GITHUB_WORKSPACE/release-assets/KZ-Nexus-iOS-${GITHUB_REF_NAME}.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Nexus-iOS
          path: release-assets/*.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: KZ-Nexus-Android, path: release-assets}
      - uses: actions/download-artifact@v4
        with: {name: KZ-Nexus-iOS, path: release-assets}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: KZ Nexus ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          generate_release_notes: true
          files: release-assets/*