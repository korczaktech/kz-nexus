name: Korczak HUB Nexus Release

on:
  push:
    branches: [main]
    tags: ['v0.0.0.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do release (ex.: 0.0.0.294)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      desktop_version: ${{ steps.version.outputs.desktop_version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolver versão
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v0\.0\.0\.[0-9]+$' | sed 's/^v0\.0\.0\.//' | sort -n | tail -1 || true)"
            latest="${latest:-293}"
            VERSION="0.0.${latest}" 
            VERSION="0.0.0.$((latest + 1))"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versão inválida: $VERSION"; exit 1; }
          DESKTOP_VERSION="0.0.$(echo "$VERSION" | awk -F. '{print $4}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "desktop_version=$DESKTOP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$(echo "$VERSION" | awk -F. '{print $4}')" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kzdoc-release.jks"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/kzdoc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --parallel --stacktrace -PreleaseVersion="${{ needs.prepare.outputs.version }}" -PreleaseCode="${{ needs.prepare.outputs.version_code }}" 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: warn
      - name: Rename APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android
          path: release-assets/*.apk

  android-test:
    needs: prepare
    # Android emulator runs on the Linux hosted runner; macOS 13 was retired and could leave this job queued.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kzdoc-release.jks"
      - name: Run release instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/kzdoc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 5X
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: gradle -p android connectedReleaseAndroidTest --no-daemon -PreleaseVersion="${{ needs.prepare.outputs.version }}" -PreleaseCode="${{ needs.prepare.outputs.version_code }}"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            ext: exe
          - os: macos-15
            command: npm run dist:mac
            ext: dmg
          - os: ubuntu-24.04
            command: npm run dist:linux
            ext: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: desktop
        run: npm install
      - name: Set desktop version
        working-directory: desktop
        shell: bash
        run: npm version "${{ needs.prepare.outputs.desktop_version }}" --no-git-tag-version
      - name: Build Desktop
        working-directory: desktop
        run: ${{ matrix.command }}
      - name: Normalize release filename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          file="$(find desktop/dist -maxdepth 1 -type f -name '*.'${{ matrix.ext }} -print -quit)"
          test -n "$file"
          cp "$file" "release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ matrix.ext }}
          path: release-assets/*

  publish:
    needs: [prepare, android, android-test, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nexus-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.apk"
          test -f "release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.deb"
          test -f "release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.dmg"
          test -f "release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.exe"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Korczak HUB Nexus ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.apk
            release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.deb
            release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.dmg
            release-assets/Korczak-HUB-Nexus-${{ needs.prepare.outputs.version }}.exe


      - name: Publish Android updater manifest
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const version = process.env.VERSION;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            const apk = release.data.assets.find((asset) => asset.name === `Korczak-HUB-Nexus-${version}.apk`);
            if (!apk) throw new Error("APK do release não encontrado.");
            const digest = apk.digest?.replace(/^sha256:/, "");
            if (!digest) throw new Error("SHA-256 do APK não disponível.");
            const update = JSON.stringify({
              version,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${apk.name}`,
              sha256: digest
            }, null, 2) + "\n";
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "update.json",
                ref: "updates"
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "update.json",
              message: `chore(updater): publicar ${version}`,
              content: Buffer.from(update).toString("base64"),
              branch: "updates",
              ...(sha ? { sha } : {})
            });
